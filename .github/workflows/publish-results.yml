name: Run & publish results

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install openpyxl matplotlib numpy

      - name: Generate charts
        run: python dcf_summary.py

      - name: Commit outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f dcf_*.png 2>/dev/null || true
          git diff --staged --quiet || (git commit -m "Update DCF charts [skip ci]" && git pull --rebase origin main && git push)
